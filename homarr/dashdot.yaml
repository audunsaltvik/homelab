---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashdot
  namespace: homarr
  labels:
    app: dashdot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashdot
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: dashdot
    spec:
      containers:
        - name: dashdot
          image: mauricenino/dashdot:latest
          ports:
            - containerPort: 3001
          env:
            - name: TZ
              value: "Europe/Oslo"
            - name: DASHDOT_ENABLE_CPU_TEMPS
              value: "true"
          volumeMounts:
            - name: host
              mountPath: /mnt/host
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          securityContext:
            privileged: true
      volumes:
        - name: host
          hostPath:
            path: /
---
apiVersion: v1
kind: Service
metadata:
  name: dashdot
  namespace: homarr
spec:
  type: ClusterIP
  selector:
    app: dashdot
  ports:
    - port: 3001
      targetPort: 3001
# Note: DASHDOT_PORT=3001 is required - set via:
# kubectl set env deployment/dashdot --namespace homarr DASHDOT_PORT=3001
