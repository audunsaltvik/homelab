---
apiVersion: v1
kind: Namespace
metadata:
  name: garmin-grafana

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garmin-fetch-data
  namespace: garmin-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: garmin-fetch-data
  template:
    metadata:
      labels:
        app: garmin-fetch-data
    spec:
      containers:
        - name: garmin-fetch-data
          image: ghcr.io/arpanghosh8453/garmin-fetch-data:latest
          env:
            - name: GARMINCONNECT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: garmin-secret
                  key: email
            - name: GARMINCONNECT_BASE64_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: garmin-secret
                  key: b64password
            - name: INFLUXDB_HOST
              value: influxdb
            - name: INFLUXDB_PORT
              value: "8086"
            - name: INFLUXDB_DATABASE
              value: garmin
          volumeMounts:
            - name: garmin-data
              mountPath: /data
            - name: garmin-token
              mountPath: /home/appuser/.garminconnect
      volumes:
        - name: garmin-data
          emptyDir: {}
        - name: garmin-token
          persistentVolumeClaim:
            claimName: garmin-token-pvc

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: influxdb
  namespace: garmin-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: influxdb
  template:
    metadata:
      labels:
        app: influxdb
    spec:
      containers:
        - name: influxdb
          image: influxdb:1.8
          ports:
            - containerPort: 8086
          env:
            - name: INFLUXDB_DB
              value: garmin
          volumeMounts:
            - name: influxdb-data
              mountPath: /var/lib/influxdb
      volumes:
        - name: influxdb-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: influxdb
  namespace: garmin-grafana
spec:
  selector:
    app: influxdb
  ports:
    - port: 8086
      targetPort: 8086

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: garmin-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_INSTALL_PLUGINS
              value: marcusolsson-hourly-heatmap-panel
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
      volumes:
        - name: grafana-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: garmin-grafana
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
