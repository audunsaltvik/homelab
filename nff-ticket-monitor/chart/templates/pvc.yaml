apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nff-ticket-monitor.name" . }}-data
  labels:
    {{- include "nff-ticket-monitor.labels" . | nindent 4 }}
  annotations:
    # State is the whole point of this app - losing it means replaying every
    # notification. Keep the volume even if the release is uninstalled.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.storage.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
