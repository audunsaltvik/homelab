# Deliberately outside the Helm chart so real credentials never end up in a
# templated manifest or in git.
#
#   cp nff-monitor-secret.example.yaml nff-monitor-secret.yaml
#   $EDITOR nff-monitor-secret.yaml          # replace the placeholders
#   kubectl apply -f nff-monitor-secret.yaml
#
# nff-monitor-secret.yaml is gitignored. Do not commit it.
---
apiVersion: v1
kind: Secret
metadata:
  name: nff-monitor-secret
  namespace: nff-monitor
type: Opaque
stringData:
  # From @BotFather.
  TELEGRAM_BOT_TOKEN: "REPLACE_WITH_BOT_TOKEN"

  # Your chat id. Message the bot, then:
  #   curl -s https://api.telegram.org/bot<TOKEN>/getUpdates | jq '.result[].message.chat.id'
  TELEGRAM_CHAT_ID: "REPLACE_WITH_CHAT_ID"

  # Optional heartbeat. The key must exist because the chart references it;
  # leave it as an empty string to disable pinging.
  UPTIME_KUMA_PUSH_URL: ""
