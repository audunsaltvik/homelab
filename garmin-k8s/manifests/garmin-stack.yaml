---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    name: monitoring
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
# InfluxDB PersistentVolumeClaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: influxdb-data
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path

---
# Grafana PersistentVolumeClaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path

---
# Garmin Tokens PersistentVolumeClaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garmin-tokens
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
  storageClassName: local-path

---
# NOTE: Secrets are now managed separately in secrets.yaml
# See secrets.yaml.example for instructions on creating secrets.yaml
# Apply secrets first: kubectl apply -f secrets.yaml

---
# ConfigMap for Grafana datasource provisioning
# Note: Password will be injected via environment variable substitution
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: garmin_influxdb
        type: influxdb
        access: proxy
        url: http://influxdb:8086
        database: ${INFLUXDB_DATABASE}
        user: ${INFLUXDB_USERNAME}
        secureJsonData:
          password: ${INFLUXDB_PASSWORD}
        jsonData:
          httpMode: GET
        uid: garmin_influxdb
        isDefault: true

---
# InfluxDB StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: influxdb
  namespace: monitoring
  labels:
    app: influxdb
spec:
  serviceName: influxdb
  replicas: 1
  selector:
    matchLabels:
      app: influxdb
  template:
    metadata:
      labels:
        app: influxdb
    spec:
      containers:
      - name: influxdb
        image: influxdb:1.11
        ports:
        - containerPort: 8086
          name: http
        env:
        - name: INFLUXDB_DB
          valueFrom:
            secretKeyRef:
              name: influxdb-credentials
              key: database
        - name: INFLUXDB_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: influxdb-credentials
              key: username
        - name: INFLUXDB_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: influxdb-credentials
              key: password
        - name: INFLUXDB_HTTP_AUTH_ENABLED
          value: "true"
        volumeMounts:
        - name: influxdb-data
          mountPath: /var/lib/influxdb
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /ping
            port: 8086
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ping
            port: 8086
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: influxdb-data
        persistentVolumeClaim:
          claimName: influxdb-data

---
# InfluxDB Service
apiVersion: v1
kind: Service
metadata:
  name: influxdb
  namespace: monitoring
  labels:
    app: influxdb
spec:
  type: ClusterIP
  ports:
  - port: 8086
    targetPort: 8086
    protocol: TCP
    name: http
  selector:
    app: influxdb

---
# Grafana Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
        runAsUser: 472
        runAsNonRoot: true
      containers:
      - name: grafana
        image: grafana/grafana:11.4.0
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: GF_SECURITY_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: grafana-credentials
              key: admin-user
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-credentials
              key: admin-password
        - name: GF_INSTALL_PLUGINS
          value: "marcusolsson-hourly-heatmap-panel"
        - name: GF_PATHS_PROVISIONING
          value: /etc/grafana/provisioning
        # InfluxDB credentials for datasource provisioning
        - name: INFLUXDB_DATABASE
          valueFrom:
            secretKeyRef:
              name: influxdb-credentials
              key: database
        - name: INFLUXDB_USERNAME
          valueFrom:
            secretKeyRef:
              name: influxdb-credentials
              key: username
        - name: INFLUXDB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: influxdb-credentials
              key: password
        volumeMounts:
        - name: grafana-data
          mountPath: /var/lib/grafana
        - name: grafana-datasource
          mountPath: /etc/grafana/provisioning/datasources
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: grafana-data
        persistentVolumeClaim:
          claimName: grafana-data
      - name: grafana-datasource
        configMap:
          name: grafana-datasource

---
# Grafana Service (NodePort for external access)
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  type: NodePort
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30300
    protocol: TCP
    name: http
  selector:
    app: grafana

---
# Garmin Data Fetcher Initial Setup Job
# Run this ONCE to authenticate and save tokens
apiVersion: batch/v1
kind: Job
metadata:
  name: garmin-initial-setup
  namespace: monitoring
  labels:
    app: garmin-fetch
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: garmin-fetch
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsNonRoot: true
      containers:
      - name: garmin-fetch
        image: ghcr.io/arpanghosh8453/garmin-fetch-data:latest
        env:
        - name: INFLUXDB_HOST
          value: "influxdb"
        - name: INFLUXDB_PORT
          value: "8086"
        - name: INFLUXDB_DATABASE
          valueFrom:
            secretKeyRef:
              name: influxdb-credentials
              key: database
        - name: INFLUXDB_USERNAME
          valueFrom:
            secretKeyRef:
              name: influxdb-credentials
              key: username
        - name: INFLUXDB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: influxdb-credentials
              key: password
        - name: GARMINCONNECT_IS_CN
          value: "False"
        - name: FETCH_SELECTION
          value: "daily_avg,sleep,steps,heartrate,stress,breathing,hrv,vo2,activity,race_prediction,body_composition"
        - name: GARMINCONNECT_EMAIL
          valueFrom:
            secretKeyRef:
              name: garmin-credentials
              key: email
        - name: GARMINCONNECT_BASE64_PASSWORD
          valueFrom:
            secretKeyRef:
              name: garmin-credentials
              key: password
        volumeMounts:
        - name: garmin-tokens
          mountPath: /home/appuser/.garminconnect
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: garmin-tokens
        persistentVolumeClaim:
          claimName: garmin-tokens

---
# Garmin Data Fetcher CronJob
# Runs every 6 hours to fetch new data
apiVersion: batch/v1
kind: CronJob
metadata:
  name: garmin-fetch
  namespace: monitoring
  labels:
    app: garmin-fetch
spec:
  # Run every 6 hours: 0 */6 * * *
  # For testing, use: */15 * * * * (every 15 minutes)
  schedule: "0 */6 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: garmin-fetch
        spec:
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 1000
            runAsUser: 1000
            runAsNonRoot: true
          containers:
          - name: garmin-fetch
            image: ghcr.io/arpanghosh8453/garmin-fetch-data:latest
            env:
            - name: INFLUXDB_HOST
              value: "influxdb"
            - name: INFLUXDB_PORT
              value: "8086"
            - name: INFLUXDB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: influxdb-credentials
                  key: database
            - name: INFLUXDB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: influxdb-credentials
                  key: username
            - name: INFLUXDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: influxdb-credentials
                  key: password
            - name: GARMINCONNECT_IS_CN
              value: "False"
            - name: FETCH_SELECTION
              value: "daily_avg,sleep,steps,heartrate,stress,breathing,hrv,vo2,activity,race_prediction,body_composition"
            volumeMounts:
            - name: garmin-tokens
              mountPath: /home/appuser/.garminconnect
            resources:
              requests:
                memory: "256Mi"
                cpu: "100m"
              limits:
                memory: "512Mi"
                cpu: "500m"
          volumes:
          - name: garmin-tokens
            persistentVolumeClaim:
              claimName: garmin-tokens

---
# NetworkPolicy: Allow Grafana to access InfluxDB
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-to-influxdb
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: influxdb
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: grafana
    ports:
    - protocol: TCP
      port: 8086
  egress:
  # Allow DNS resolution
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53

---
# NetworkPolicy: Allow Garmin Fetcher to access InfluxDB
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-garmin-to-influxdb
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: influxdb
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: garmin-fetch
    ports:
    - protocol: TCP
      port: 8086
  egress:
  # Allow DNS resolution
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53

---
# NetworkPolicy: Allow external access to Grafana
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-to-grafana
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - ports:
    - protocol: TCP
      port: 3000
  egress:
  # Allow DNS resolution
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
  # Allow Grafana to connect to InfluxDB
  - to:
    - podSelector:
        matchLabels:
          app: influxdb
    ports:
    - protocol: TCP
      port: 8086

---
# NetworkPolicy: Allow Garmin Fetcher to access external Garmin Connect API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-garmin-external-access
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: garmin-fetch
  policyTypes:
  - Egress
  egress:
  # Allow DNS resolution
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
  # Allow HTTPS to external Garmin Connect API
  - to:
    - namespaceSelector: {}
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 443
  # Allow HTTP (in case of redirects)
  - to:
    - namespaceSelector: {}
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 80
  # Allow connection to InfluxDB
  - to:
    - podSelector:
        matchLabels:
          app: influxdb
    ports:
    - protocol: TCP
      port: 8086
