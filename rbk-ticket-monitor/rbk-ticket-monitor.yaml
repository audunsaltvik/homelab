---
apiVersion: v1
kind: Namespace
metadata:
  name: rbk-monitor

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rbk-monitor-data
  namespace: rbk-monitor
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 100Mi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rbk-ticket-monitor
  namespace: rbk-monitor
  labels:
    app: rbk-ticket-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rbk-ticket-monitor
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: rbk-ticket-monitor
    spec:
      containers:
        - name: monitor
          image: localhost/rbk-ticket-monitor:latest
          imagePullPolicy: Never
          env:
            - name: TZ
              value: "Europe/Oslo"
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rbk-monitor-secret
                  key: TELEGRAM_BOT_TOKEN
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: rbk-monitor-secret
                  key: TELEGRAM_CHAT_ID
            - name: CHECK_INTERVAL
              value: "300"  # Check every 5 minutes
            - name: CHECK_WOMENS_MATCHES
              value: "false"  # Set to "false" to disable notifications for women's matches (Toppserien)
            - name: STATE_FILE
              value: "/data/state.json"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rbk-monitor-data

# Secret should be created manually to avoid committing sensitive values.
# Create it with:
# kubectl create secret generic rbk-monitor-secret \
#   --namespace rbk-monitor \
#   --from-literal=TELEGRAM_BOT_TOKEN=your_bot_token_here \
#   --from-literal=TELEGRAM_CHAT_ID=your_chat_id_here
